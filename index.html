/* ---- torchlight -------------------------------------------------------- */
const TORCH_LIGHTS = [];
let flameMeshes = [];
function buildTorches() {
  // flame quads: instanced emissive cubes, three phase groups
  const groups = [[], [], []];
  BRAZIERS.forEach((p, i) => groups[i % 3].push(p));
  flameMeshes = groups.map((g, gi) => {
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(1, 0.5, 0.14), transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: true,
    });
    const TIERS = [[0.52, 0.62, 0.0], [0.36, 0.50, 0.48], [0.21, 0.38, 0.84]];
    const mesh = new THREE.InstancedMesh(UNIT, mat, Math.max(1, g.length * TIERS.length));
    const m4 = new THREE.Matrix4();
    let w = 0;
    g.forEach((p) => {
      for (const [sw, sh, oy] of TIERS) {
        m4.makeScale(sw, sh, sw); m4.setPosition(p.x, p.y + 0.18 + oy, p.z); mesh.setMatrixAt(w++, m4);
      }
    });
    if (!w) { m4.makeScale(0, 0, 0); mesh.setMatrixAt(0, m4); }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.renderOrder = 6;
    scene.add(mesh);
    return { mesh, mat, phase: gi * 2.1 };
  });

  // a handful of real point lights at the most prominent braziers
  const picks = [];
  const wanted = 9;
  for (let i = 0; i < BRAZIERS.length && picks.length < wanted; i += Math.max(1, Math.floor(BRAZIERS.length / wanted)))
    picks.push(BRAZIERS[i]);
  for (const p of picks) {
    const l = new THREE.PointLight(0xFF9838, 0, 46, 2);
    l.position.copy(p).add(new THREE.Vector3(0, 1.2, 0));
    scene.add(l);
    TORCH_LIGHTS.push({ l, ph: rnd() * 6.283 });
  }
}

const NUMS = ['sunInt', 'hemiInt', 'fillInt', 'fogD', 'exposure', 'bloom', 'stars', 'fogSunStr', 'fogGround', 'dust', 'aerial', 'rim',
  'sunGlow', 'sunSize', 'discInt', 'haze', 'torch', 'reflStr', 'sparkle', 'waterGlow', 'goldEm', 'envInt'];
const COLS = ['sunCol', 'skyTop', 'skyMid', 'skyHor', 'skyGnd', 'hemiSky', 'hemiGnd', 'fillCol', 'fog', 'fogSun', 'rimCol', 'hazeCol',
  'waterShallow', 'waterDeep', 'reflTint'];

// the interpolated "now" of the Ra system — one slot per blended parameter
const live = { sunDir: new THREE.Vector3(), fillDir: new THREE.Vector3() };
for (const k of COLS) live[k] = new THREE.Color();

let presetFrom = PRESETS[2], presetTo = PRESETS[2], presetT = 1, presetDur = 1;
let currentIdx = 2, cycling = false, cycleTimer = 0;
const CYCLE_HOLD = 11, CYCLE_BLEND = 5;

function applyLighting(t) {
  const a = presetFrom, b = presetTo;
  const e = t * t * (3 - 2 * t);
  for (const k of NUMS) live[k] = mix(a[k], b[k], e);
  for (const k of COLS) live[k].copy(C(a[k])).lerp(C(b[k]), e);
  live.sunDir.copy(a.sunDir).lerp(b.sunDir, e).normalize();
  live.fillDir.copy(a.fillDir).lerp(b.fillDir, e).normalize();

  sun.position.copy(live.sunDir).multiplyScalar(760).add(sun.target.position);
  sun.color.copy(live.sunCol); sun.intensity = live.sunInt;
  fill.position.copy(live.fillDir).multiplyScalar(500);
  fill.color.copy(live.fillCol); fill.intensity = live.fillInt;
  hemi.color.copy(live.hemiSky); hemi.groundColor.copy(live.hemiGnd); hemi.intensity = live.hemiInt;

  skyUniforms.uSkyTop.value.copy(live.skyTop);
  skyUniforms.uSkyMid.value.copy(live.skyMid);
  skyUniforms.uSkyHorizon.value.copy(live.skyHor);
  skyUniforms.uSkyGround.value.copy(live.skyGnd);
  skyUniforms.uSunDir.value.copy(live.sunDir);
  skyUniforms.uSunCol.value.copy(live.sunCol);
  skyUniforms.uSunGlow.value = live.sunGlow;
  skyUniforms.uSunSize.value = live.sunSize;
  skyUniforms.uDiscInt.value = live.discInt;
  skyUniforms.uHazeCol.value.copy(live.hazeCol);
  skyUniforms.uHaze.value = live.haze;
  skyUniforms.uStars.value = live.stars;

  scene.fog.color.copy(live.fog);
  scene.fog.density = live.fogD;
  ATMO.fogSunDir.value.copy(live.sunDir);
  ATMO.fogSunColor.value.copy(live.fogSun);
  ATMO.fogSunStrength.value = live.fogSunStr;
  ATMO.fogGroundBoost.value = live.fogGround;
  ATMO.aerial.value = live.aerial;
  RIM.uRimStr.value = live.rim;
  RIM.uRimCol.value.copy(live.rimCol);
  renderer.toneMappingExposure = live.exposure;
  if (bloomPass) bloomPass.strength = live.bloom;

  matGold.emissiveIntensity = live.goldEm;
  matCasing.envMapIntensity = live.envInt;
  matStone.envMapIntensity = live.envInt * 0.55;
  matSand.envMapIntensity = live.envInt * 0.30;

  waterUniforms.uShallow.value.copy(live.waterShallow);
  waterUniforms.uDeep.value.copy(live.waterDeep);
  waterUniforms.uReflTint.value.copy(live.reflTint);
  waterUniforms.uReflStrength.value = (REFL_SCALE_LEVELS[reflLevel] === 0) ? 0 : live.reflStr;
  waterUniforms.uSparkle.value = live.sparkle;
  waterUniforms.uGlow.value = live.waterGlow;
  waterUniforms.uSunDirW.value.copy(live.sunDir);
  waterUniforms.uSunColW.value.copy(live.sunCol);
}

function gotoPreset(i, dur = 1.8) {
  presetFrom = blendSnapshot();
  presetTo = PRESETS[i];
  presetT = 0; presetDur = dur;
  currentIdx = i;
  syncHud();
}
/** freeze the current interpolated state so a new blend starts from exactly here */
function blendSnapshot() {
  const s = {};
  for (const k of NUMS) s[k] = live[k];
  for (const k of COLS) s[k] = '#' + live[k].getHexString();
  s.sunDir = live.sunDir.clone(); s.fillDir = live.fillDir.clone();
  s.name = 'blend';
  return s;
}

/* ==========================================================================
   11.  CAMERA — cinematic orbit + causeway flyover
   ========================================================================== */

const orbit = {
  target: new THREE.Vector3(-40, 38, -20), tTarget: new THREE.Vector3(-40, 38, -20),
  dist: 400, tDist: 400, theta: 1.800, tTheta: 1.800, phi: 1.3614, tPhi: 1.3614,
  idle: 0, auto: 0.0075,
};
const lookTarget = new THREE.Vector3().copy(orbit.target);
let tour = false, tourT = 0;
const TOUR_DUR = 62;

const TOUR_POS = new THREE.CatmullRomCurve3([
  new THREE.Vector3(248, 32, 62),  new THREE.Vector3(202, 25, 46),  new THREE.Vector3(164, 20, 34),
  new THREE.Vector3(132, 18, 27),  new THREE.Vector3(104, 23, 22),  new THREE.Vector3(80, 29, 22),
  new THREE.Vector3(54, 35, 22),   new THREE.Vector3(18, 54, 22),   new THREE.Vector3(-18, 60, 22),
  new THREE.Vector3(-48, 64, 16),  new THREE.Vector3(-58, 76, -24), new THREE.Vector3(-30, 88, -66),
  new THREE.Vector3(12, 94, -94),  new THREE.Vector3(64, 96, -104), new THREE.Vector3(146, 88, -78),
  new THREE.Vector3(224, 54, -8),
], true, 'catmullrom', 0.35);

const TOUR_LOOK = new THREE.CatmullRomCurve3([
  new THREE.Vector3(154, 20, 32),  new THREE.Vector3(122, 19, 27),  new THREE.Vector3(100, 20, 24),
  new THREE.Vector3(86, 22, 22),   new THREE.Vector3(76, 26, -14),  new THREE.Vector3(74, 26, -22),
  new THREE.Vector3(66, 24, -22),  new THREE.Vector3(-58, 46, 18),  new THREE.Vector3(-94, 50, 12),
  new THREE.Vector3(-105, 52, 6),  new THREE.Vector3(-72, 50, -18), new THREE.Vector3(-42, 44, -78),
  new THREE.Vector3(-40, 40, -80), new THREE.Vector3(-40, 38, -80), new THREE.Vector3(-58, 34, -62),
  new THREE.Vector3(46, 24, 12),
], true, 'catmullrom', 0.35);

function orbitPose(out) {
  const sph = new THREE.Spherical(orbit.dist, orbit.phi, orbit.theta);
  out.setFromSpherical(sph).add(orbit.target);
  return out;
}
const _pose = new THREE.Vector3();

function setupInput() {
  const el = renderer.domElement;
  let drag = null, lx = 0, ly = 0, pinch = 0;
  const bump = () => { orbit.idle = 0; };

  el.addEventListener('pointerdown', (e) => {
    el.setPointerCapture(e.pointerId);
    drag = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    lx = e.clientX; ly = e.clientY; bump();
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY; bump();
    if (drag === 'orbit') {
      orbit.tTheta -= dx * 0.0042;
      orbit.tPhi = clamp(orbit.tPhi - dy * 0.0034, 0.16, 1.505);
    } else {
      const k = orbit.dist * 0.0016;
      const right = new THREE.Vector3().setFromSphericalCoords(1, Math.PI / 2, orbit.theta + Math.PI / 2);
      const fwd = new THREE.Vector3().setFromSphericalCoords(1, Math.PI / 2, orbit.theta);
      orbit.tTarget.addScaledVector(right, -dx * k).addScaledVector(fwd, -dy * k);
      orbit.tTarget.y = clamp(orbit.tTarget.y, 2, 160);
    }
  });
  const up = (e) => { drag = null; try { el.releasePointerCapture(e.pointerId); } catch (_) {} };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('wheel', (e) => {
    e.preventDefault(); bump();
    orbit.tDist = clamp(orbit.tDist * Math.pow(1.0016, e.deltaY), 26, 1100);
  }, { passive: false });

  el.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinch) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      orbit.tDist = clamp(orbit.tDist * (pinch / d), 26, 1100); pinch = d; bump();
    }
  }, { passive: true });
  el.addEventListener('touchend', () => { pinch = 0; }, { passive: true });

  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === '1') gotoPreset(0); else if (k === '2') gotoPreset(1);
    else if (k === '3') gotoPreset(2); else if (k === '4') gotoPreset(3);
    else if (k === 'c') toggleCycle();
    else if (k === 't') toggleTour();
  });
}

function updateCamera(dt) {
  const k = 1 - Math.pow(0.0016, dt);          // frame-rate independent damping
  if (tour) {
    tourT = (tourT + dt / TOUR_DUR) % 1;
    const p = TOUR_POS.getPointAt(tourT), l = TOUR_LOOK.getPointAt(tourT);
    camera.position.lerp(p, 1 - Math.pow(0.02, dt));
    lookTarget.lerp(l, 1 - Math.pow(0.03, dt));
    // keep the orbit rig glued to the flight so releasing Tour never snaps
    orbit.target.copy(lookTarget); orbit.tTarget.copy(lookTarget);
    const off = new THREE.Vector3().subVectors(camera.position, lookTarget);
    const sph = new THREE.Spherical().setFromVector3(off);
    orbit.dist = orbit.tDist = sph.radius;
    orbit.phi = orbit.tPhi = clamp(sph.phi, 0.16, 1.505);
    orbit.theta = orbit.tTheta = sph.theta;
  } else {
    orbit.idle += dt;
    if (orbit.idle > 5) orbit.tTheta += orbit.auto * dt;
    orbit.theta += (orbit.tTheta - orbit.theta) * k;
    orbit.phi += (orbit.tPhi - orbit.phi) * k;
    orbit.dist += (orbit.tDist - orbit.dist) * k;
    orbit.target.lerp(orbit.tTarget, k);
    camera.position.copy(orbitPose(_pose));
    lookTarget.lerp(orbit.target, k * 1.4 > 1 ? 1 : k * 1.4);
  }
  // never let the lens go underground
  const ground = sampleH(camera.position.x, camera.position.z);
  const minY = Math.max(ground + 3.0, WATER_Y + 1.5);
  if (camera.position.y < minY) camera.position.y = minY;
  camera.lookAt(lookTarget);
}

/* ==========================================================================
   12.  HUD
   ========================================================================== */

const hud = document.getElementById('hud');
const btnCycle = document.getElementById('btnCycle');
const btnTour = document.getElementById('btnTour');

function syncHud() {
  hud.querySelectorAll('[data-preset]').forEach(b => {
    b.classList.toggle('on', !cycling && +b.dataset.preset === currentIdx);
  });
  btnCycle.classList.toggle('on', cycling);
  btnTour.classList.toggle('on', tour);
}
function toggleCycle() {
  cycling = !cycling;
  cycleTimer = 0;
  if (cycling) gotoPreset((currentIdx + 1) % PRESETS.length, CYCLE_BLEND);
  syncHud();
}
function toggleTour() {
  tour = !tour;
  if (tour) {
    // enter at the closest point on the flight path
    let best = 0, bd = Infinity;
    for (let i = 0; i < 60; i++) {
      const u = i / 60, d = TOUR_POS.getPointAt(u).distanceTo(camera.position);
      if (d < bd) { bd = d; best = u; }
    }
    tourT = best;
  }
  syncHud();
}
hud.querySelectorAll('[data-preset]').forEach(b => {
  b.addEventListener('click', () => { cycling = false; gotoPreset(+b.dataset.preset); });
});
btnCycle.addEventListener('click', toggleCycle);
btnTour.addEventListener('click', toggleTour);

/* ==========================================================================
   13.  POST + LOOP
   ========================================================================== */

let composer = null, bloomPass = null, gtaoPass = null;
function setupComposer() {
  // the composer's own target has to carry the MSAA — the renderer's
  // antialias flag only applies to the default framebuffer
  const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
    type: THREE.HalfFloatType, samples: 4,
  });
  composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));

  // screen-space contact occlusion: the crevices between masonry courses,
  // terrace risers and temple setbacks that a shadow map cannot resolve
  gtaoPass = new GTAOPass(scene, camera, innerWidth, innerHeight);
  gtaoPass.output = GTAOPass.OUTPUT.Default;
  gtaoPass.blendIntensity = 0.85;
  gtaoPass.updateGtaoMaterial({
    radius: 3.2, distanceExponent: 1.4, thickness: 2.5,
    scale: 1.0, samples: 16, screenSpaceRadius: false,
  });
  gtaoPass.updatePdMaterial({ lumaPhi: 8, depthPhi: 3, normalPhi: 4, radius: 6, rings: 2, samples: 12 });
  const gtaoRenderInner = gtaoPass.render.bind(gtaoPass);
  gtaoPass.render = (r, w, rd, dt, mk) => {
    const skip = [dustMesh, ...flameMeshes.map(f => f.mesh)].filter(Boolean);
    const was = skip.map(o => o.visible);
    skip.forEach(o => { o.visible = false; });
    gtaoRenderInner(r, w, rd, dt, mk);
    skip.forEach((o, i) => { o.visible = was[i]; });
  };
  composer.addPass(gtaoPass);

  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.56, 0.45, 1.06);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
  if (bloomPass) bloomPass.setSize(innerWidth, innerHeight);
  if (gtaoPass) gtaoPass.setSize(innerWidth, innerHeight);
  sizeReflection();
});

const _dustV = new THREE.Vector3();
const clock = new THREE.Clock();
let envTimer = 0, frameAvg = 16, adaptCooldown = 4;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // preset blend
  let blending = false;
  if (presetT < 1) { presetT = Math.min(1, presetT + dt / presetDur); blending = true; }
  if (cycling) {
    cycleTimer += dt;
    if (presetT >= 1 && cycleTimer > CYCLE_HOLD) {
      cycleTimer = 0;
      const nxt = (currentIdx + 1) % PRESETS.length;
      gotoPreset(nxt, CYCLE_BLEND);
      cycling = true; syncHud();
      blending = true;
    }
  }
  if (blending || presetT === 1) applyLighting(presetT);

  skyUniforms.uTime.value = t;
  waterUniforms.uTime.value = t;
  WIND.uTime.value = t;

  // IBL refresh — cheap when static, throttled while the sun moves
  envTimer += dt;
  if (envRT === null || (blending && envTimer > 0.28)) { envTimer = 0; refreshEnvironment(); }

  // torches
  const torch = live.torch ?? 0;
  for (const f of flameMeshes) {
    const fl = 0.62 + 0.38 * (Math.sin(t * 11.3 + f.phase) * 0.5 + Math.sin(t * 6.7 + f.phase * 2.2) * 0.5);
    const a = torch * fl;
    f.mat.color.setRGB(2.6 * a, 1.05 * a, 0.26 * a);
    f.mesh.visible = torch > 0.02;
  }
  for (const tl of TORCH_LIGHTS) {
    const fl = 0.55 + 0.45 * Math.sin(t * 9.1 + tl.ph) * Math.cos(t * 4.3 + tl.ph * 1.7);
    tl.l.intensity = 190 * torch * (0.7 + 0.5 * fl);
  }
  // dust glows only when the sun rakes it, and always faces the lens
  if (dustMesh) {
    const toSun = live.sunDir.dot(camera.getWorldDirection(_dustV).negate());
    const rake = clamp(0.30 + 0.70 * Math.max(toSun, 0), 0, 1);
    dustMat.color.copy(live.sunCol).multiplyScalar(live.dust * rake);
    dustMesh.visible = live.dust > 0.01;
    dustMesh.quaternion.copy(camera.quaternion);
  }

  // flocks wheel over the marshes
  {
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sv = new THREE.Vector3(), pv = new THREE.Vector3();
    const up = new THREE.Vector3(0, 1, 0);
    for (const fl of FLOCKS) {
      for (let i = 0; i < fl.birds.length; i++) {
        const b = fl.birds[i];
        const a = b.ph + t * b.sp;
        pv.set(fl.c.x + Math.cos(a) * b.r, fl.c.y + b.yo + Math.sin(a * 2.1) * 1.6, fl.c.z + Math.sin(a) * b.r);
        q.setFromAxisAngle(up, -a + Math.PI / 2);
        const flap = 1 + Math.sin(t * 7.5 + b.ph) * 0.35;
        sv.set(b.sc, b.sc, b.sc * flap);
        m4.compose(pv, q, sv);
        fl.mesh.setMatrixAt(i, m4);
      }
      fl.mesh.instanceMatrix.needsUpdate = true;
    }
  }

  // boats ride the swell
  for (const b of BOATS) {
    b.m.position.y = b.y0 + Math.sin(t * 0.9 + b.ph) * 0.22;
    b.m.rotation.z = Math.sin(t * 0.7 + b.ph * 1.3) * 0.012;
  }

  updateCamera(dt);

  renderReflection();
  if (blending) renderer.shadowMap.needsUpdate = true;
  composer.render();

  // light adaptive guard on the reflection pass
  frameAvg = frameAvg * 0.94 + dt * 1000 * 0.06;
  adaptCooldown -= dt;
  if (adaptCooldown <= 0 && frameAvg > 30) {
    if (gtaoPass && gtaoPass.enabled) { gtaoPass.enabled = false; adaptCooldown = 8; frameAvg = 16; }
    else if (reflLevel < REFL_SCALE_LEVELS.length - 1) {
      reflLevel++; sizeReflection(); applyLighting(presetT); adaptCooldown = 8; frameAvg = 16;
    }
  }
}

/* ==========================================================================
   14.  BOOT
   ========================================================================== */

const loader = document.getElementById('loader');
const ltxt = document.getElementById('ltxt');
const lbar = document.getElementById('lbar');
const step = (label, pct) => new Promise(r => {
  ltxt.textContent = label; lbar.style.width = pct + '%';
  requestAnimationFrame(() => requestAnimationFrame(r));
});

async function boot() {
  await step('Surveying the plateau', 8);
  layFields();
  bakeTerrain();

  await step('Tracing the sky horizon', 18);
  bakeSkyOcclusion();

  await step('Laying the sand', 24);
  buildTerrain();

  await step('Raising the pyramids', 44);
  buildMonuments();

  await step('Carving the Sphinx', 58);
  buildSphinx();

  await step('Setting the casing stones', 68);
  scene.add(instancedBoxes(casingList, matCasing, 'casing'));
  scene.add(instancedBoxes(stoneList, matStone, 'stone'));
  const goldMesh = instancedBoxes(goldList, matGold, 'gold');
  goldMesh.castShadow = true;
  scene.add(goldMesh);

  await step('Flooding the Nile', 80);
  buildWater();
  sizeReflection();

  await step('Planting the delta', 90);
  populateLife();
  buildFleet();
  buildBirds();
  buildDust();
  buildTorches();

  await step('Waking Ra', 98);
  setupComposer();
  setupInput();
  refreshEnvironment();
  presetFrom = presetTo = PRESETS[2];
  presetT = 1;
  applyLighting(1);
  syncHud();
  renderer.shadowMap.needsUpdate = true;

  await step('Ready', 100);
  loader.classList.add('gone');
  setTimeout(() => loader.remove(), 900);
  clock.start();
  frame();
}
boot().catch(err => {
  ltxt.textContent = 'Build failed — see console';
  console.error(err);
});
</script>
